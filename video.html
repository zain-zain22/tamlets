<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>പഠന വീഡിയോ - സ്റ്റുഡന്റ് പാനൽ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { 
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
    margin: 0; 
    padding: 20px; 
    min-height: 100vh; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    overflow: auto; 
  }
  
  body.page-rotated {
    width: 100vh;
    height: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px;
  }

  .panel-card {
    background: #ffffff;
    width: 100%;
    max-width: 950px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    padding: 20px;
    text-align: center;
    border-top: 6px solid #3498db;
    position: relative;
    margin: auto;
    transition: transform 0.3s ease;
    transform-origin: center center;
  }

  body.page-rotated .panel-card {
    transform: rotate(90deg);
    transform-origin: center center;
    margin: auto;
  }

  .lesson-title {
    font-size: 22px;
    color: #2c3e50;
    font-weight: bold;
    margin-bottom: 5px;
  }

  .lesson-sub {
    font-size: 14px;
    color: #16a085;
    font-weight: 600;
    margin-bottom: 15px;
    background: #e8f8f5;
    padding: 6px 12px;
    border-radius: 6px;
    display: inline-block;
  }

  .video-container-wrapper {
    display: flex;
    align-items: center;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .video-wrapper {
    position: relative;
    width: 100%;
    max-width: 780px;
    padding-bottom: 56.25%;
    height: 0;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    flex-grow: 1;
  }

  .video-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    pointer-events: none;
  }

  .transparent-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0);
    z-index: 10;
  }

  /* ബട്ടണുകൾ ഒരേ നിരയിൽ (Horizontal) അടുത്തടുത്ത് */
  .side-controls {
    display: flex;
    flex-direction: row;
    gap: 10px;
    justify-content: center;
    width: 100%;
    margin-top: 15px;
  }

  .btn-control {
    background: #2ecc71;
    color: white;
    border: none;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    white-space: nowrap;
    flex: 1;
  }

  .btn-control:hover {
    transform: scale(1.05);
  }

  .btn-pause {
    background: #e74c3c;
    box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);
  }

  .btn-rotate {
    background: #9b59b6;
    box-shadow: 0 4px 10px rgba(155, 89, 182, 0.3);
  }

  .verify-modal {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    z-index: 20;
    border-radius: 15px;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .verify-modal h3 {
    color: #fff;
    margin-bottom: 15px;
    font-size: 22px;
  }

  .btn-verify {
    background: #f1c40f;
    color: #2c3e50;
    border: none;
    padding: 12px 25px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="panel-card" id="mainCard">
  <div class="verify-modal" id="verifyModal">
    <h3>🙋‍♂️ നിങ്ങൾ ഇവിടെത്തന്നെയുണ്ടോ?</h3>
    <p style="color:#ddd; font-size:15px; margin-bottom:15px;">പഠനം തുടരുന്നതിനായി താഴെ ക്ലിക്ക് ചെയ്യുക:</p>
    <button class="btn-verify" onclick="resumeLesson()">അതെ, ഞാൻ പഠിക്കുകയാണ് 👍</button>
  </div>

  <div class="lesson-title" id="lessonHeading">പാഠം ലോഡ് ചെയ്യുന്നു...</div>
  <div class="lesson-sub" id="lessonSubHeading">വിവരങ്ങൾ ശേഖരിക്കുന്നു</div>

  <div class="video-container-wrapper">
    <div class="video-wrapper" id="videoWrapperBox">
      <div class="transparent-overlay"></div>
      <div id="player"></div>
    </div>
    
    <!-- പ്ലേയും 'വലുതാക്കുക' ബട്ടണും ഒരേ നിരയിൽ -->
    <div class="side-controls">
      <button class="btn-control" id="playPauseBtn" onclick="togglePlayPause()">
        <i class="fa-solid fa-play"></i> പ്ലേ
      </button>
      <button class="btn-control btn-rotate" id="rotateBtn" onclick="togglePageRotation()">
        <i class="fa-solid fa-expand"></i> വലുതാക്കുക
      </button>
    </div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
let player;
let isPlaying = false;
let randomPauseTimer = null;
let isPageRotated = false;

async function loadYouTubeLesson() {
  try {
    let res = await fetch('data/data_book.json?t=' + Date.now());
    if(res.ok) {
      let data = await res.json();
      let info = data.globalInfo || {};
      
      let cls = info.class || info.globalClass || 'N/A';
      let subj = info.subject || info.globalSubject || 'N/A';
      let chp = info.chapter || info.globalChapter || 'N/A';
      let lName = info.lessonName || info.globalLessonName || 'പഠന വീഡിയോ';

      document.getElementById('lessonHeading').innerText = `പാഠം: ${lName}`;
      document.getElementById('lessonSubHeading').innerText = `വിഷയം: ${subj} | ക്ലാസ്: ${cls} | ചാപ്റ്റർ: ${chp}`;

      let ytLink = info.youtubeLink || info.globalYoutubeLink || "";
      let videoId = extractVideoId(ytLink);

      if(videoId) {
        initYoutubePlayer(videoId);
      } else {
        document.getElementById('player').innerHTML = `<p style="color:white; padding-top:20%;">യൂട്യൂബ് ലിങ്ക് ലഭ്യമല്ല.</p>`;
      }
    }
  } catch(e) {
    document.getElementById('lessonHeading').innerText = "ഡാറ്റ ലഭ്യമായില്ല.";
  }
}

function extractVideoId(url) {
  let videoId = "";
  if (url.includes('youtu.be/')) {
    videoId = url.split('youtu.be/')[1].split('?')[0];
  } else if (url.includes('watch?v=')) {
    videoId = url.split('watch?v=').pop().split('&')[0];
  } else if (url.includes('embed/')) {
    videoId = url.split('embed/')[1].split('?')[0];
  }
  return videoId;
}

function initYoutubePlayer(videoId) {
  window.onYouTubeIframeAPIReady = function() {
    player = new YT.Player('player', {
      videoId: videoId,
      playerVars: {
        'controls': 0,
        'disablekb': 1,
        'modestbranding': 1,
        'rel': 0
      },
      events: {
        'onStateChange': onPlayerStateChange
      }
    });
  };
  if (window.YT && window.YT.Player) {
    window.onYouTubeIframeAPIReady();
  }
}

function togglePlayPause() {
  if (!player) return;
  
  if (isPlaying) {
    player.pauseVideo();
  } else {
    player.playVideo();
  }
}

function togglePageRotation() {
  isPageRotated = !isPageRotated;
  let bodyElem = document.body;
  let rotateBtn = document.getElementById('rotateBtn');

  if (isPageRotated) {
    bodyElem.classList.add('page-rotated');
    rotateBtn.innerHTML = '<i class="fa-solid fa-compress"></i> ചെറുതാക്കുക';
  } else {
    bodyElem.classList.remove('page-rotated');
    rotateBtn.innerHTML = '<i class="fa-solid fa-expand"></i> വലുതാക്കുക';
  }
}

function onPlayerStateChange(event) {
  let btn = document.getElementById('playPauseBtn');
  if (event.data == YT.PlayerState.PLAYING) {
    isPlaying = true;
    btn.innerHTML = '<i class="fa-solid fa-pause"></i> പോസ്';
    btn.classList.add('btn-pause');
    scheduleRandomPause();
  } else {
    isPlaying = false;
    btn.innerHTML = '<i class="fa-solid fa-play"></i> പ്ലേ';
    btn.classList.remove('btn-pause');
    clearTimeout(randomPauseTimer);
  }
}

function scheduleRandomPause() {
  clearTimeout(randomPauseTimer);
  let randomTime = Math.floor(Math.random() * (90 - 30 + 1) + 30) * 1000;

  randomPauseTimer = setTimeout(() => {
    if (isPlaying && player) {
      player.pauseVideo();
      document.getElementById('verifyModal').style.display = 'flex';
    }
  }, randomTime);
}

function resumeLesson() {
  document.getElementById('verifyModal').style.display = 'none';
  if (player) {
    player.playVideo();
  }
}

window.onload = loadYouTubeLesson;
</script>

</body>
</html>
