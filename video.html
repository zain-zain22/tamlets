<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>പഠന വീഡിയോ - സ്റ്റുഡന്റ് പാനൽ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { 
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
    margin: 0; 
    padding: 15px; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
  }
  
  .panel-card {
    background: #ffffff;
    width: 100%;
    max-width: 900px; /* പാനലിന്റെ മൊത്തത്തിലുള്ള വീതി കൂട്ടിയിരിക്കുന്നു */
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    padding: 30px;
    text-align: center;
    border-top: 8px solid #3498db;
    position: relative;
  }

  .lesson-title {
    font-size: 26px; /* പാഠത്തിന്റെ പേര് വലുതാക്കി */
    color: #2c3e50;
    font-weight: bold;
    margin-bottom: 8px;
  }

  .lesson-sub {
    font-size: 16px; /* ക്ലാസ്, വിഷയം എന്നിവ വ്യക്തമായി കാണാൻ വലിപ്പം കൂട്ടി */
    color: #16a085;
    font-weight: 600;
    margin-bottom: 25px;
    background: #e8f8f5;
    padding: 8px 15px;
    border-radius: 8px;
    display: inline-block;
  }

  .video-wrapper {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
    height: 0;
    background: #000;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  }

  .video-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    pointer-events: none; /* നേരിട്ട് ക്ലിക്ക് ചെയ്ത് സ്കിപ്പ് ചെയ്യുന്നത് തടയാൻ */
  }

  /* സുതാര്യമായ ഓവർലേ ലെയർ */
  .transparent-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0);
    z-index: 10;
  }

  /* കസ്റ്റം കൺട്രോൾസ് */
  .controls-box {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
  }

  .btn-control {
    background: #2ecc71;
    color: white;
    border: none;
    padding: 14px 35px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
    transition: all 0.2s;
  }

  .btn-control:hover {
    transform: scale(1.05);
  }

  .btn-pause {
    background: #e74c3c;
    box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
  }

  .info-box {
    margin-top: 20px;
    padding: 15px;
    background: #f8fafc;
    border-radius: 10px;
    font-size: 14px;
    color: #475569;
    border: 1px solid #e2e8f0;
  }

  /* വെരിഫിക്കേഷൻ പോപ്പ്അപ്പ് */
  .verify-modal {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    z-index: 20;
    border-radius: 20px;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .verify-modal h3 {
    color: #fff;
    margin-bottom: 15px;
    font-size: 24px;
  }

  .btn-verify {
    background: #f1c40f;
    color: #2c3e50;
    border: none;
    padding: 14px 30px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="panel-card">
  <!-- വെരിഫിക്കേഷൻ പോപ്പ്അപ്പ് -->
  <div class="verify-modal" id="verifyModal">
    <h3>🙋‍♂️ നിങ്ങൾ ഇവിടെത്തന്നെയുണ്ടോ?</h3>
    <p style="color:#ddd; font-size:16px; margin-bottom:20px;">പഠനം തുടരുന്നതിനായി താഴെ ക്ലിക്ക് ചെയ്യുക:</p>
    <button class="btn-verify" onclick="resumeLesson()">അതെ, ഞാൻ പഠിക്കുകയാണ് 👍</button>
  </div>

  <div class="lesson-title" id="lessonHeading">പാഠം ലോഡ് ചെയ്യുന്നു...</div>
  <div class="lesson-sub" id="lessonSubHeading">വിവരങ്ങൾ ശേഖരിക്കുന്നു</div>

  <div class="video-wrapper">
    <div class="transparent-overlay"></div>
    <div id="player"></div>
  </div>

  <div class="controls-box">
    <button class="btn-control" id="playPauseBtn" onclick="togglePlayPause()">
      <i class="fa-solid fa-play"></i> പ്ലേ ചെയ്യുക
    </button>
  </div>

  <div class="info-box">
    <i class="fa-solid fa-shield-halved"></i> വീഡിയോ സ്കിപ്പ് ചെയ്യാനോ വേഗത കൂട്ടാനോ സാധിക്കില്ല. ശ്രദ്ധിച്ച് മുഴുവനായി കാണുക.
  </div>
</div>

<!-- YouTube IFrame Player API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
let player;
let isPlaying = false;
let randomPauseTimer = null;

async function loadYouTubeLesson() {
  try {
    let res = await fetch('data/data_book.json?t=' + Date.now());
    if(res.ok) {
      let data = await res.json();
      let info = data.globalInfo || {};
      
      document.getElementById('lessonHeading').innerText = info.lessonName ? `പാഠം: ${info.lessonName}` : "പഠന വീഡിയോ";
      document.getElementById('lessonSubHeading').innerText = `വിഷയം: ${info.subject || 'N/A'} | ക്ലാസ്: ${info.class || 'N/A'} | ചാപ്റ്റർ: ${info.chapter || 'N/A'}`;

      let ytLink = info.youtubeLink || "";
      let videoId = extractVideoId(ytLink);

      if(videoId) {
        initYoutubePlayer(videoId);
      } else {
        document.getElementById('player').innerHTML = `<p style="color:white; padding-top:20%;">യൂട്യൂബ് ലിങ്ക് ലഭ്യമല്ല.</p>`;
      }
    }
  } catch(e) {
    document.getElementById('lessonHeading').innerText = "ഡാറ്റ ലഭ്യമായില്ല.";
  }
}

function extractVideoId(url) {
  let videoId = "";
  if (url.includes('youtu.be/')) {
    videoId = url.split('youtu.be/')[1].split('?')[0];
  } else if (url.includes('watch?v=')) {
    videoId = url.split('watch?v=')[1].split('&')[0];
  } else if (url.includes('embed/')) {
    videoId = url.split('embed/')[1].split('?')[0];
  }
  return videoId;
}

function initYoutubePlayer(videoId) {
  window.onYouTubeIframeAPIReady = function() {
    player = new YT.Player('player', {
      videoId: videoId,
      playerVars: {
        'controls': 0,
        'disablekb': 1,
        'modestbranding': 1,
        'rel': 0
      },
      events: {
        'onStateChange': onPlayerStateChange
      }
    });
  };
  if (window.YT && window.YT.Player) {
    window.onYouTubeIframeAPIReady();
  }
}

function togglePlayPause() {
  if (!player) return;
  
  if (isPlaying) {
    player.pauseVideo();
  } else {
    player.playVideo();
  }
}

function onPlayerStateChange(event) {
  let btn = document.getElementById('playPauseBtn');
  if (event.data == YT.PlayerState.PLAYING) {
    isPlaying = true;
    btn.innerHTML = '<i class="fa-solid fa-pause"></i> പോസ് ചെയ്യുക';
    btn.classList.add('btn-pause');
    scheduleRandomPause();
  } else {
    isPlaying = false;
    btn.innerHTML = '<i class="fa-solid fa-play"></i> പ്ലേ ചെയ്യുക';
    btn.classList.remove('btn-pause');
    clearTimeout(randomPauseTimer);
  }
}

function scheduleRandomPause() {
  clearTimeout(randomPauseTimer);
  let randomTime = Math.floor(Math.random() * (90 - 30 + 1) + 30) * 1000;

  randomPauseTimer = setTimeout(() => {
    if (isPlaying && player) {
      player.pauseVideo();
      document.getElementById('verifyModal').style.display = 'flex';
    }
  }, randomTime);
}

function resumeLesson() {
  document.getElementById('verifyModal').style.display = 'none';
  if (player) {
    player.playVideo();
  }
}

window.onload = loadYouTubeLesson;
</script>

</body>
</html>
